<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Filtros de Imagem</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>

  <body>

    <header>
      <h1 style="font-size: 80px;">Filtros de Imagem</h1>
        <p>
          Aplicação web de filtros clássicos de detecção de bordas (Sobel, Laplaciano e Canny)
        </p>
    </header>

    <form method="POST" enctype="multipart/form-data">
      
    <input type="file" id="fileInput" name="imagem" accept="image/*" hidden required>
    <label for="fileInput" class="upload-btn">
        Escolher imagem
    </label>

    <p id="fileName" class="file-name">Nenhum arquivo selecionado</p>
      <button class="upload-btn" type="submit" >Processar</button>
    </form>

    {% if erro %}
      <p class="erro">{{ erro }}</p>
    {% endif %}

    {% if imagens %}
    <section class="grid">
      <div class="card">
        <h2>Sobel</h2>
        <img src="data:image/png;base64,{{ sobel_b64 }}">
      </div>

      <div class="card">
        <h2>Laplaciano</h2>
        <img src="data:image/png;base64,{{ laplaciano_b64 }}">
      </div>

      <div class="card">
        <h2>Canny</h2>
        <img src="data:image/png;base64,{{ canny_b64 }}">
      </div>
    </section>
    {% else %}
    <section class="grid placeholder">
      <div class="card">
        <h2>Sobel</h2>
        <img class="placeholder-img" src="/static/images.jpeg" alt="Exemplo de imagem">
      </div>

      <div class="card">
        <h2>Laplaciano</h2>
        <img class="placeholder-img" src="/static/images.jpeg" alt="Exemplo de imagem">
      </div>

      <div class="card">
        <h2>Canny</h2>
        <img class="placeholder-img" src="/static/images.jpeg" alt="Exemplo de imagem">
      </div>
    </section>
    {% endif %}

    <script>
        const input = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');

        input.addEventListener('change', () => {
            if (input.files.length > 0) {
                fileName.textContent = input.files[0].name;
            } else {
                fileName.textContent = 'Nenhum arquivo selecionado';
            }
        });
    </script>
